name: saver_bbk_main
description: "A new Flutter project."
publish_to: "none"
version: 1.0.8+8

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^5.6.5
  cupertino_icons: ^1.0.8
  dotted_border: ^2.1.0
